<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>rubik's cube solver XD</title>
	<style>

		body {
			margin: 0;
			overflow: hidden;
			user-select: none;
			color: #fff;
			font-family: monospace;
			font-size: 10px;
			background: #151515;
		}

		* {
			-webkit-tap-highlight-color: transparent;
		}

		#canvas, #hudCanvas, .ui {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
		}

		.ui, #hudCanvas {
			opacity: 0.7;
			pointer-events: none;
			transform-origin: 0 0;
		}

		.header {
			position: absolute;
			right: 12px;
			top: 12px;
			display: flex; 
			grid-gap: 4px;
			flex-direction: column;
			align-items: end;
			font-size: 12px;
		}

		.title {
			font-size: 16px;
		}

		.range {
			--color: #888;
			-webkit-appearance: none;
			outline: 0;
			position: relative;
			overflow: hidden;
			font-size: 15px;
			height: 1em;
			width: 5em;
			cursor: col-resize;
			border-radius: 0.15em;
			margin: 0;
			flex: 1;
		}

		::-webkit-slider-runnable-track {
			background: #444;
		}

		::-webkit-slider-thumb {
			-webkit-appearance: none;
			width: 0;
			height: 1em;
			background: transparent;
			box-shadow: -100em 0 0 100em var(--color);
		}

		::-moz-range-track {
			height: 1em;
			background: #aaa;
		}

		::-moz-range-thumb {
			width: 0.3em;
			height: 1em;
			background: #fff;
			box-shadow: -100em 0 0 100em var(--color);
			border-radius: 0 !important;
		}

		.checkbox {
			font-size: 15px;
			width: 1em;
			height: 1em;
			background: #777;
			margin: 0;
			appearance: none;
			-webkit-appearance: none;
			position: relative;
			cursor: pointer;
			outline: 0;
			border-radius: 0.15em;
			transition: 0.1s background;
		}

		.checkbox:checked {
			background: #ccc;
		}

		.settings {
			position: absolute;
			left: 12px;
			top: 12px;
			display: flex;
			grid-gap: 5px;
			flex-direction: column;
			align-items: start;
		}

		.settings * {
			pointer-events: all;
		}

		label {
			cursor: pointer;
		}

		.row {
			display: flex;
			grid-gap: 5px;
			align-items: center;
		}

		.btn {
			color: #fff;
			padding: 0.4em 0.7em;
			background: hsla(0, 0%, 20%, 0.3);
			border: 2px solid hsla(0, 0%, 100%, 0.2);
			border-radius: 4px;
			cursor: pointer;
			text-align: center;
		}

	</style>
</head>
<body>
	<canvas id="canvas"></canvas>
	<canvas id="hudCanvas"></canvas>
	<div class="ui">
		<div class="settings">
		</div>
		<div class="header">
			<div class="title">Rubik's Cube Solver XD</div>
			<div>by Chu Won :p</div>
			<div>jus4randi<3</div>
		</div>
	</div>
	<script>

		// solver is based on https://github.com/vivaansinghvi07/pycubing
		
		const Faces = Enum({
			Front: 1,
			Left: 1,
			Back: 1,
			Right: 1,
			Top: 1,
			Bottom: 1
		});

		const Colors = Enum({
			Green: 1,
			Orange: 1,
			Blue: 1,
			Red: 1,
			Yellow: 1,
			White: 1
		});

		const FaceToColor = {
			[Faces.Front]: '#36ff1a',
			[Faces.Left]: '#ff721a',
			[Faces.Back]: '#1a1aff',
			[Faces.Right]: '#ff1a1a',
			[Faces.Top]: '#fff11a',
			[Faces.Bottom]: '#ffffff'
		};

		const ColorToString = {
			[Colors.Green]: 'G',
			[Colors.Orange]: 'O',
			[Colors.Blue]: 'B',
			[Colors.Red]: 'R',
			[Colors.White]: 'W',
			[Colors.Yellow]: 'Y'
		};

		const FaceToString = {
			[Faces.Front]: 'F',
			[Faces.Left]: 'L',
			[Faces.Back]: 'B',
			[Faces.Right]: 'R',
			[Faces.Top]: 'U',
			[Faces.Bottom]: 'D'
		};

		const StringToColor = InverseEnum(ColorToString);
		const StringToFace = InverseEnum(FaceToString);

		function InverseEnum(map) {
			const out = {};
			for (const key in map) {
				out[map[key]] = parseInt(key);
			}
			return out;
		}

		function Enum(map) {
			let i = 0;
			for (const key in map) {
				map[key] = i++;
			}
			map.length = i;
			return map;
		}

		const EdgeMap = {
			[Faces.Front]: {
				[Faces.Top]: [1, 0],
				[Faces.Bottom]: [1, 2],
				[Faces.Left]: [0, 1],
				[Faces.Right]: [2, 1]
			},
			[Faces.Back]: {
				[Faces.Top]: [1, 0],
				[Faces.Bottom]: [1, 2],
				[Faces.Left]: [2, 1],
				[Faces.Right]: [0, 1]
			},
			[Faces.Right]: {
				[Faces.Top]: [1, 0],
				[Faces.Bottom]: [1, 2],
				[Faces.Front]: [0, 1],
				[Faces.Back]: [2, 1]
			},
			[Faces.Left]: {
				[Faces.Top]: [1, 0],
				[Faces.Bottom]: [1, 2],
				[Faces.Front]: [2, 1],
				[Faces.Back]: [0, 1]
			},
			[Faces.Top]: {
				[Faces.Front]: [1, 2],
				[Faces.Back]: [1, 0],
				[Faces.Left]: [0, 1],
				[Faces.Right]: [2, 1]
			},
			[Faces.Bottom]: {
				[Faces.Front]: [1, 0],
				[Faces.Back]: [1, 2],
				[Faces.Left]: [0, 1],
				[Faces.Right]: [2, 1]
			}
		};

		const CornerMap = {
			[`${Faces.Front},${Faces.Top},${Faces.Left}`]: [
				[0, 0],
				[0, 2],
				[2, 0]
			],
			[`${Faces.Front},${Faces.Top},${Faces.Right}`]: [
				[2, 0],
				[2, 2],
				[0, 0]
			],
			[`${Faces.Front},${Faces.Bottom},${Faces.Left}`]: [
				[0, 2],
				[0, 0],
				[2, 2]
			],
			[`${Faces.Front},${Faces.Bottom},${Faces.Right}`]: [
				[2, 2],
				[2, 0],
				[0, 2]
			],
			[`${Faces.Back},${Faces.Top},${Faces.Left}`]: [
				[2, 0],
				[0, 0],
				[0, 0]
			],
			[`${Faces.Back},${Faces.Top},${Faces.Right}`]: [
				[0, 0],
				[2, 0],
				[2, 0]
			],
			[`${Faces.Back},${Faces.Bottom},${Faces.Left}`]: [
				[2, 2],
				[0, 2],
				[0, 2]
			],
			[`${Faces.Back},${Faces.Bottom},${Faces.Right}`]: [
				[0, 2],
				[2, 2],
				[2, 2]
			]
		};

		const SideFaces = [Faces.Front, Faces.Right, Faces.Back, Faces.Left];

		const SideEdges = [
			[Faces.Left, Faces.Front],
			[Faces.Front, Faces.Right],
			[Faces.Right, Faces.Back],
			[Faces.Back, Faces.Left]
		];

		const AxisMoves = {
			x: 'R', 
			y: 'U', 
			z: 'F'
		};

		class Cube {
			constructor(size = 3) {
				this.size = size;
				this.matrix = [];

				for (let i = 0; i < Faces.length; i++) {
					this.matrix[i] = [];
					for (let y = 0; y < this.size; y++) {
						this.matrix[i][y] = [];
						for (let x = 0; x < this.size; x++) {
							this.matrix[i][y][x] = i;
						}
					}
				}
			}

			isSolved() {
				for (let i = 0; i < Faces.length; i++) {
					let color = this.matrix[i][0][0];
					for (let y = 0; y < this.size; y++) {
						for (let x = 0; x < this.size; x++) {
							if (this.matrix[i][y][x] !== color) return false;
						}
					}
				}

				return true;
			}

			turnRight(dist, layer, width) {
				dist = this.clampDist(dist, layer, width);

				if (layer - width === 0) {
					this.turnFace(Faces.Right, dist);
				}

				if (layer === this.size) {
					this.turnFace(Faces.Left, 4 - dist);
				}

				const faceList = [Faces.Front, Faces.Top, Faces.Back, Faces.Bottom];

				const old = this.copy();

				for (let j = 0; j < faceList.length; j++) {
					const from = faceList[j];
					const to = faceList[(j + dist) % faceList.length];

					for (let i = 0; i < width; i++) {
						const x = this.size - 1 - (layer - 1) + i;
						for (let y = 0; y < this.size; y++) {
							let tx = x,
								ty = y;
							let fx = x,
								fy = y;

							if (to === Faces.Back) {
								tx = this.size - 1 - x;
								ty = this.size - 1 - y;
							}

							if (from === Faces.Back) {
								fx = this.size - 1 - x;
								fy = this.size - 1 - y;
							}

							this.matrix[to][ty][tx] = old[from][fy][fx];
						}
					}
				}
			}

			turnLeft(dist, layer, width) {
				dist = this.clampDist(dist, layer, width);

				if (layer - width === 0) {
					this.turnFace(Faces.Left, dist);
				}

				if (layer === this.size) {
					this.turnFace(Faces.Right, 4 - dist);
				}

				const faceList = [Faces.Front, Faces.Bottom, Faces.Back, Faces.Top];

				const old = this.copy();

				for (let j = 0; j < faceList.length; j++) {
					const from = faceList[j];
					const to = faceList[(j + dist) % faceList.length];

					for (let i = 0; i < width; i++) {
						const x = layer - 1 - i;
						for (let y = 0; y < this.size; y++) {
							let tx = x,
								ty = y;
							let fx = x,
								fy = y;

							if (to === Faces.Back) {
								tx = this.size - 1 - x;
								ty = this.size - 1 - y;
							}

							if (from === Faces.Back) {
								fx = this.size - 1 - x;
								fy = this.size - 1 - y;
							}

							this.matrix[to][ty][tx] = old[from][fy][fx];
						}
					}
				}
			}

			turnTop(dist, layer, width) {
				dist = this.clampDist(dist, layer, width);

				if (layer - width === 0) {
					this.turnFace(Faces.Top, dist);
				}

				if (layer === this.size) {
					this.turnFace(Faces.Bottom, 4 - dist);
				}

				const faceList = [Faces.Front, Faces.Left, Faces.Back, Faces.Right];

				const old = this.copy();

				for (let j = 0; j < faceList.length; j++) {
					const from = faceList[j];
					const to = faceList[(j + dist) % faceList.length];

					for (let i = 0; i < width; i++) {
						const y = layer - 1 - i;
						for (let x = 0; x < this.size; x++) {
							this.matrix[to][y][x] = old[from][y][x];
						}
					}
				}
			}

			turnBottom(dist, layer, width) {
				dist = this.clampDist(dist, layer, width);

				if (layer - width === 0) {
					this.turnFace(Faces.Bottom, dist);
				}

				if (layer === this.size) {
					this.turnFace(Faces.Top, 4 - dist);
				}

				const faceList = [Faces.Front, Faces.Right, Faces.Back, Faces.Left];

				const old = this.copy();

				for (let j = 0; j < faceList.length; j++) {
					const from = faceList[j];
					const to = faceList[(j + dist) % faceList.length];

					for (let i = 0; i < width; i++) {
						const y = this.size - 1 - (layer - 1) + i;
						for (let x = 0; x < this.size; x++) {
							this.matrix[to][y][x] = old[from][y][x];
						}
					}
				}
			}

			turnFront(dist, layer, width) {
				dist = this.clampDist(dist, layer, width);

				if (layer - width === 0) {
					this.turnFace(Faces.Front, dist);
				}

				if (layer === this.size) {
					this.turnFace(Faces.Back, 4 - dist);
				}

				const faceList = [Faces.Left, Faces.Top, Faces.Right, Faces.Bottom];

				const old = this.copy();

				for (let j = 0; j < faceList.length; j++) {
					const from = faceList[j];
					const to = faceList[(j + dist) % faceList.length];

					for (let i = 0; i < width; i++) {
						const x = this.size - 1 - (layer - 1) + i;
						for (let y = 0; y < this.size; y++) {
							let tx = x,
								ty = y;
							let fx = x,
								fy = y;

							if (from === Faces.Left) {
								fy = this.size - 1 - y;
							} else if (from === Faces.Top) {
								fx = y;
								fy = x;
							} else if (from === Faces.Right) {
								fx = this.size - 1 - x;
							} else if (from === Faces.Bottom) {
								fx = this.size - 1 - y;
								fy = this.size - 1 - x;
							}

							if (to === Faces.Top) {
								tx = y;
								ty = x;
							} else if (to === Faces.Right) {
								tx = this.size - 1 - x;
							} else if (to === Faces.Bottom) {
								tx = this.size - 1 - y;
								ty = this.size - 1 - x;
							} else if (to === Faces.Left) {
								ty = this.size - 1 - y;
							}

							this.matrix[to][ty][tx] = old[from][fy][fx];
						}
					}
				}
			}

			turnBack(dist, layer, width) {
				dist = this.clampDist(dist, layer, width);

				if (layer - width === 0) {
					this.turnFace(Faces.Back, dist);
				}

				if (layer === this.size) {
					this.turnFace(Faces.Front, 4 - dist);
				}

				const faceList = [Faces.Left, Faces.Bottom, Faces.Right, Faces.Top];

				const old = this.copy();

				for (let j = 0; j < faceList.length; j++) {
					const from = faceList[j];
					const to = faceList[(j + dist) % faceList.length];

					for (let i = 0; i < width; i++) {
						const x = layer - 1 - i;
						for (let y = 0; y < this.size; y++) {
							let tx = x,
								ty = y;
							let fx = x,
								fy = y;

							if (from === Faces.Left) {
								fx = x;
								fy = y;
							} else if (from === Faces.Bottom) {
								fx = y;
								fy = this.size - 1 - x;
							} else if (from === Faces.Right) {
								fx = this.size - 1 - x;
								fy = this.size - 1 - y;
							} else if (from === Faces.Top) {
								fx = this.size - 1 - y;
								fy = x;
							}

							if (to === Faces.Bottom) {
								tx = y;
								ty = this.size - 1 - x;
							} else if (to === Faces.Right) {
								tx = this.size - 1 - x;
								ty = this.size - 1 - y;
							} else if (to === Faces.Top) {
								tx = this.size - 1 - y;
								ty = x;
							} else if (to === Faces.Left) {
								tx = x;
								ty = y;
							}

							this.matrix[to][ty][tx] = old[from][fy][fx];
						}
					}
				}
			}

			copy() {
				const out = [];
				for (let i = 0; i < this.matrix.length; i++) {
					out[i] = [];
					for (let y = 0; y < this.size; y++) {
						out[i][y] = Array.from(this.matrix[i][y]);
					}
				}
				return out;
			}

			turnFace(face, dist = 1) {
				const array = this.matrix[face];

				const old = [];
				for (let y = 0; y < this.size; y++) {
					old[y] = Array.from(array[y]);
				}

				for (let y = 0; y < this.size; y++) {
					for (let x = 0; x < this.size; x++) {
						let nx, ny;
						if (dist === 1) {
							nx = this.size - 1 - y;
							ny = x;
						} else if (dist === 2) {
							nx = this.size - 1 - x;
							ny = this.size - 1 - y;
						} else if (dist === 3) {
							nx = y;
							ny = this.size - 1 - x;
						}

						array[ny][nx] = old[y][x];
					}
				}
			}

			fromString(text) {
				const s2 = this.size * this.size;
				const n = Faces.length * s2;
				if (text.length !== n) {
					throw new Error(`String needs to be of length ${n}, got ${text.length}.`);
				}

				for (let i = 0; i < n; i++) {
					const face = Math.floor(i / s2);
					const color = StringToColor[text[i]];
					if (color === undefined) throw new Error(`Unknown color at ${i}.`);

					const j = i % s2;
					const x = j % this.size;
					const y = Math.floor(j / this.size);
					this.matrix[color][y][x] = color;
				}
			}

			toString() {
				let out = '';

				for (let i = 0; i < Faces.length; i++) {
					for (let j = 0; j < this.size; j++) {
						for (let k = 0; k < this.size; k++) {
							const color = this.matrix[i][j][k];
							out += ColorToString[color];
						}
					}
				}

				return out;
			}

			toString2() {
				const rows = [
					[-1, Faces.Top],
					[Faces.Left, Faces.Front, Faces.Right, Faces.Back],
					[-1, Faces.Bottom]
				];

				let maxLength = -1;
				for (const row of rows) {
					if (row.length > maxLength) {
						maxLength = row.length;
					}
				}

				const width = maxLength * this.size;
				const height = rows.length * this.size;
				const out = Array.from({
					length: height
				}, () => Array(width).fill(' '));

				for (let i = 0; i < rows.length; i++) {
					const list = rows[i];
					for (let j = 0; j < list.length; j++) {
						const face = list[j];
						if (face === -1) continue;

						for (let y = 0; y < this.size; y++) {
							for (let x = 0; x < this.size; x++) {
								const color = this.matrix[face][y][x];
								out[i * this.size + y][j * this.size + x] = ColorToString[color]; // || /*(FaceToString[face] + String.fromCharCode(65 + y * this.size + x)) || */ColorToString[color];
							}
						}
					}
				}

				return out.map(row => row.join(' ')).join('\n');
			}

			clampDist(dist, layer, width) {
				if (layer > this.size || layer < 1) throw new Error(`Invalid layer: ${layer}.`);
				if (width > layer || width < 1) throw new Error(`Invalid width: ${width}.`);
				if (dist === 0) throw new Error(`Invalid dist: ${dist}.`);
				
				dist %= 4;
				dist < 0 && (dist += 4);
				return dist;
			}

			turn(move, dist = 1, layer = 1, width = 1) {
				if (dist === 0) return;

				switch (move) {
					case 'F': this.turnFront(dist, layer, width); break;
					case 'B': this.turnBack(dist, layer, width); break;
					case 'U': this.turnTop(dist, layer, width); break;
					case 'D': this.turnBottom(dist, layer, width); break;
					case 'L': this.turnLeft(dist, layer, width); break;
					case 'R': this.turnRight(dist, layer, width); break;
					default: throw new Error(`Invalid move: ${move}.`);
				}

				this.onTurn?.apply(this, arguments);
			}

			parse(text) {
				// Width:LayerMoveDist 
				// 2:2F'

				const list = text.split(' ');
				for (let text of list) {
					text = text.trim();
					if (!text) continue;

					let dist = 1;
					const last = text[text.length - 1];
					if (last === `'`) {
						dist = -1;
						text = text.slice(0, -1);
					} else if (last === '2') {
						dist = 2;
						text = text.slice(0, -1);
					}

					let move = text[text.length - 1];
					text = text.slice(0, -1);

					let layer, width;

					if (move in AxisMoves) {
						move = AxisMoves[move];
						width = layer = this.size;
					} else {
						const items = text.split(':');
						layer = parseInt(items.pop()) || 1;
						width = parseInt(items.pop()) || 1;
					}

					this.turn(move, dist, layer, width);
				}
			}

			scramble() {
				const moves = 'FBUDLR';

				const n = Math.round((this.size ** 2) * 2);
				for (let i = 0; i < n; i++) {
					const dist = Math.ceil(Math.random() * 3);
					const layer = Math.ceil(Math.random() * this.size);
					const width = Math.ceil(Math.random() * layer);
					const move = moves[Math.floor(Math.random() * moves.length)];
					this.turn(move, dist, layer, width);
				}
			}

			getEdge(a, b) {
				const coordA = EdgeMap[a]?.[b];
				const coordB = EdgeMap[b]?.[a];
				if (!coordA || !coordB) throw new Error(`Invalid edge combination.`);

				const colorA = this.matrix[a][coordA[1]][coordA[0]];
				const colorB = this.matrix[b][coordB[1]][coordB[0]];

				return {
					c2f: {
						[colorA]: a,
						[colorB]: b
					},
					f2c: {
						[a]: colorA,
						[b]: colorB
					}
				};

			getCorner(a, b, c) {
				if (a !== Faces.Front && a !== Faces.Back) {
					if (b === Faces.Front || b === Faces.Back) {
						[a, b] = [b, a];
					} else {
						[a, c] = [c, a];
					}
				}

				if (b !== Faces.Top && b !== Faces.Bottom) {

				const corner = CornerMap[`${a},${b},${c}`];
				if (!corner) throw new Error(`Invalid corner combination.`);

				const [coordA, coordB, coordC] = corner;

				const colorA = this.matrix[a][coordA[1]][coordA[0]];
				const colorB = this.matrix[b][coordB[1]][coordB[0]];
				const colorC = this.matrix[c][coordC[1]][coordC[0]];

				return {
					c2f: {
						[colorA]: a,
						[colorB]: b,
						[colorC]: c
					},
					f2c: {
						[a]: colorA,
						[b]: colorB,
						[c]: colorC

				return this.matrix[face][1][1];
			}

			turnToText(move, dist, layer, width) {
				let out = move;
				if (layer === width && width === this.size) {
					if (move === 'F' || move === 'B') out = 'z';
					else if (move === 'R' || move === 'L') out = 'x';
					else if (move === 'U' || move === 'D') out = 'y';

				if (width > 1 && width < this.size) out = `${width}:${out}`;

				if (dist === -1) out += `'`;
				else if (dist === 2) out += `2`;

			highlight(a, b, c) {}
			dehighlight() {}

		function orient(cube) {

				case Faces.Top: cube.turn('R', 2, 2, 1); break;

		function solveWhiteCross(cube) {
			function allEdgesWhite(face) {

		function solveFirstLayerCorners(cube) {

				const centerB = cube.getCenterColor(b);

					oriented: corner.f2c[Faces.Bottom] === Colors.White && corner.f2c[a] === centerA && corner.f2c[b] === centerB

		function solveOllEdges(cube) {

			for (const face of SideFaces) {

		// NxN solver

		function solveCenters(cube) {

							let adjustDist = -1;

			function isMainEdgeSolved(frontColor, rightColor, n = cube.size - 1) {
				for (let i = 1; i < n; i++) {
					if (cube.matrix[Faces.Front][i][cube.size - 1] !== frontColor ||

					}

							!== refCube.matrix[Faces.Front][face === Faces.Top ? 0 : 2][1] ||

					}

					}

							[y === 1 ? middle : (y === 2 ? end : 0)]

					}

			const fixCenterMoves = new Int32Array(cube.size - 2);

			for (let i = 0; i < 8; i++) {
				const isTop = i < 4;
				const insertEdgeFace = isTop ? Faces.Top : Faces.Bottom;
				const insertEdgeMove = isTop ? `R U' R'` : `R' D R`;

		let projectionMatrix, viewMatrix;

		let dts = 0;

		function setTransform(layer = 1, width = 1, transform) {

					for (let k = 0; k < size; k++) {

			const c = Math.cos(a);

				0, c, -s, 0,
				0, s, c, 0,

				matrix

			const a = getAngle(dir);
			[p[2], p[0]] = rotatePoint(p[2], p[0], a);

			const s = Math.sin(a);
			const c = Math.cos(a);
			const matrix = [
				c, 0, s, 0,
				0, 1, 0, 0,
				-s, 0, c, 0,
				...p, 1
			];

			return [
				coord,
				matrix
			];

		function transformZ(i, j, k, layer, dir = 1) {

			const a = getAngle(dir);
			[p[0], p[1]] = rotatePoint(p[0], p[1], a);

			const c = Math.cos(a);

				coord,
				matrix

				y = middle,
				z = middle;

			for (let i = 0; i < arguments.length; i++) {
				const face = arguments[i];
				switch (face) {
					case Faces.Left: x = 0; break;
					case Faces.Right: x = end; break;
					case Faces.Top: y = end; break;
					case Faces.Bottom: y = 0; break;
					case Faces.Back: z = 0; break;
					case Faces.Front: z = end; break;

		function drainAnimations() {

			ry = lerpAngle(ry, nry, lf);

			cy = lerp(cy, ncy, lf);

					timeLeft -= settings.animTime;
				} else {

		function drawHud(ctx) {

			const W = canvas.width / scale;
			const H = canvas.height / scale;

			ctx.save();
			ctx.scale2(scale);

			settings.showHighlights && drawHighlights(ctx, W, H);

			drawMap(ctx, W, H);

			ctx.restore();
		}

		function drawMoves(ctx, W, H) {
			ctx.save();
			ctx.translate(W - 10, H - 10);

			let overrideText;
			if (F()) overrideText = `▲Frezni⛧`;

			ctx.save();
			ctx.translate(-50, -41);
			ctx.font = `bolder 32px monospace`;
			ctx.textAlign = 'center';
			ctx.textBaseline = 'bottom';
			ctx.fillStyle = overrideText ? getHoverColor() : 'white';
			ctx.fillText(animations.length, 0, 0);

			ctx.font = `normal 12px monospace`;
			ctx.textBaseline = 'top';
			ctx.fillText('moves', 0, 0);
			ctx.restore();

			ctx.textBaseline = 'middle';

			const f = animation ? ease(Math.clamp((animation.t / animation.dist - 0.5) / 0.5, 0, 1)) : 0;
			const r = 130;

			const n = 8;
			for (let i = 0; i <= n; i++) {
				const angle = Math.PI + Math.PI / 2 * (i - f) / (n - 1);
				const x = Math.cos(angle) * r - 5;
				const y = Math.sin(angle) * r - 5;

				ctx.translate(x, y);

				ctx.fillText(text, 0, 0);
				ctx.restore();
			}

			ctx.restore();
		}

		function drawMap(ctx, W, H) {
			ctx.save();

			const rows = [
				[-1, Faces.Top],
				[Faces.Left, Faces.Front, Faces.Right, Faces.Back],
				[-1, Faces.Bottom]
			];

			let maxLength = -1;
			for (const row of rows) {
				if (row.length > maxLength) {
					maxLength = row.length;
				}
			}

			const displaySize = Math.min(cube.size, MAX_MAP_SIZE);			
			const skip = cube.size > MAX_MAP_SIZE ? displaySize - 2 : -1;

			const width = maxLength * displaySize;
			const height = rows.length * displaySize;

			const gap = 18;
			const w = width * gap;
			const h = height * gap

			ctx.translate(10, H - 10);
			ctx.scale2(0.9 * 177.7 / h);
			ctx.translate(0, -h);

				return [
					x === displaySize - 1 ? cube.size - 1 : x, 
					y === displaySize - 1 ? cube.size - 1 : y
				];

			const p = new DOMPoint(...cursor).matrixTransform(ctx.getTransform().invertSelf());
			p.x /= w;
			p.y /= h;

			hoveredCubeId = -1;

			let hoverX, hoverY;
			const hoveredFace = rows[Math.floor(p.y * rows.length)]?.[Math.floor(p.x * maxLength)];
			if (hoveredFace in FaceToString) {
				const index = getIndex(
					Math.floor(p.x * width) % displaySize, 
					Math.floor(p.y * height) % displaySize
				);
				if (index) {
					[hoverX, hoverY] = index; 
					hoveredCubeId = getCubeIndex(hoveredFace, hoverX, hoverY)

					const dir = normalize(getCubePos(hoveredCubeId));
					nrx = Math.asin(dir[1]);
					nry = Math.atan2(dir[0], dir[2]);
				}
			}

			for (let i = 0; i < rows.length; i++) {
				const list = rows[i];
				for (let j = 0; j < list.length; j++) {
					const face = list[j];
					if (face === -1) continue;

					for (let y = 0; y < displaySize; y++) {
						for (let x = 0; x < displaySize; x++) {
							const index = getIndex(x, y);
							const px = j * displaySize + x;
							const py = i * displaySize + y;
							if (!index) {
								ctx.fillStyle = '#333';
								ctx.fillRect((px + 0.5) * gap - 3, (py + 0.5) * gap - 3, 6, 6);

							}

							const [ix, iy] = index;

							const s = 5;
							ctx.beginPath();
							ctx.roundRect((px + 0.5) * gap - s, (py + 0.5) * gap - s, s * 2, s * 2, 2);

								ctx.strokeStyle = getHoverColor();
								ctx.stroke();
							}
						}
					}
				}
			}

			ctx.restore();
		}

		function drawDirections(ctx, W, H) {
			const baseOffset = size * 0.85;
			const length = 0.5;
			const arrowSize = 0.075;
			const arrowLength = 0.2;

			let face;
			let isHighlighted;

			function project3(x, y, z) {
				if (face === Faces.Top) {
					[x, y] = rotatePoint(x, y, -Math.PI / 2);
				} else if (face === Faces.Bottom) {
					[x, y] = rotatePoint(x, y, Math.PI / 2);
				} else {

			function stroke() {
				if (isHighlighted) {

					ctx.strokeStyle = hoverColor;
					ctx.stroke();
				}

				ctx.fillStyle = ctx.strokeStyle = FaceToColor[face];
				ctx.lineWidth = 2;
				ctx.stroke();

			const center = project(0, 0, 0);

			for (let i = 0; i < Faces.length; i++) {
				face = i;
				isHighlighted = i === StringToFace[getAnimation()?.move];

				const offset = baseOffset + (isHighlighted ? (Math.sin(now / 40) * 0.5 + 0.5) * 0.15 : 0);

				const start = project3(offset, 0, 0);
				const end = project3(offset + length, 0, 0);
				const tip = project3(offset + length + arrowLength, 0, 0);

					ctx.moveTo(...start);
					ctx.lineTo(...end);
					ctx.lineJoin = ctx.lineCap = 'round';
					stroke();

					const n = 4;
					for (let i = 0; i < n; i++) {

						const p = project3(offset + length, Math.cos(a) * arrowSize, Math.sin(a) * arrowSize);
						p && points.push(p);
					}

					if (points.length === n) {
						for (let j = 0; j < 2; j++) {
							for (let i = 0; i < points.length; i++) {

								ctx.moveTo(...points[i]);
								ctx.lineTo(...points[(i + 1) % points.length]);
								ctx.lineTo(...tip);
								ctx.lineTo(...points[i]);
								j === 0 ? stroke() : ctx.fill();
							}
						}
					}

					let [x, y] = tip;
					let dx = x - center[0] * W;
					let dy = y - center[1] * H;

					let dir;
					if (Math.abs(dy) > Math.abs(dx)) {
						dir = Math.sign(dy);
						ctx.textAlign = 'center';
						ctx.textBaseline = dir === -1 ? 'bottom' : 'top';
						y += dir * 10;
					} else {
						dir = Math.sign(dx);
						ctx.textAlign = dir === -1 ? 'right' : 'left';
						ctx.textBaseline = 'middle';
						x += dir * 10;
					}

					ctx.font = `normal 12px monospace`;
					const text = FaceToString[face];

					if (isHighlighted) {
						ctx.lineWidth = 2;
						ctx.strokeStyle = hoverColor;
						ctx.strokeText(text, x, y);
					}

					ctx.fillText(text, x, y);
				}
			}
		}

		function drawHighlights(ctx, W, H) {
			const center = project(0, 0, 0);

			const ids = [];
			for (const highlightPoint of highlights) {
				ids.push(getHighlightId(highlightPoint));
			}
			hoveredCubeId > -1 && ids.push(hoveredCubeId);

			for (let i of ids) {
				const pos = getCubePos(i);
				const p = project2(...pos);
				if (p) {
					const p1 = project(pos[0] + 0.5, pos[1] + 0.5, pos[2] + 0.5);
					const offset = 10 + (Math.sin(now / 40) * 0.5 + 0.5) * 4 + Math.hypot(p[0] - p1[0], p[1] - p1[1], p[2] - p1[2]) * H;

					ctx.save();
					ctx.translate(p[0] * W, p[1] * H);
					ctx.rotate(Math.atan2(p[1] - center[1], p[0] - center[0]))
					ctx.translate(offset, 0);

					ctx.moveTo(0, 0);

					ctx.lineTo(15, 5);

					ctx.fill();

		function project(x, y, z) {
			const p = transformVector(transformVector([x, y, z, 1], viewMatrix), projectionMatrix);
			x = p[0] / p[3] * 0.5 + 0.5;
			y = 0.5 - p[1] / p[3] * 0.5;
			z = p[2] / p[3] * 0.5 + 0.5;
			return [x, y, z];
		}

		function project2(x, y, z) {
			const p = project(x, y, z);
			if (inView(...p)) return p;
		}

		function inView(x, y, z) {
			return x > -0.1 && x < 1.1 && y > -0.1 && y < 1.1 && z > 0 && z < 1;
		}

		function transformVector(p, matrix) {
			return [
				p[0] * matrix[0] + p[1] * matrix[4] + p[2] * matrix[8] + p[3] * matrix[12],
				p[0] * matrix[1] + p[1] * matrix[5] + p[2] * matrix[9] + p[3] * matrix[13],
				p[0] * matrix[2] + p[1] * matrix[6] + p[2] * matrix[10] + p[3] * matrix[14],
				p[0] * matrix[3] + p[1] * matrix[7] + p[2] * matrix[11] + p[3] * matrix[15]

		function F() {
			return animations.length === 666;
		}

		function renderBg() {
			gl.useProgram(bgProgram);
			gl.activeTexture(gl.TEXTURE0);
			gl.bindTexture(gl.TEXTURE_2D, map);
			gl.uniform1i(bgProgram.uniforms.map, 0);

			gl.uniformMatrix4fv(bgProgram.uniforms.projectionMatrix, false, projectionMatrix);
			gl.uniformMatrix4fv(bgProgram.uniforms.viewMatrix, false, viewMatrix);

			gl.bindBuffer(gl.ARRAY_BUFFER, cubeMesh.positionBuffer);
			gl.enableVertexAttribArray(bgProgram.attributes.position);
			gl.vertexAttribPointer(bgProgram.attributes.position, 3, gl.FLOAT, false, 0, 0);

			gl.cullFace(gl.FRONT);
			gl.drawArrays(gl.TRIANGLES, 0, cubeMesh.vertexCount);
			gl.cullFace(gl.BACK);

			gl.disableVertexAttribArray(bgProgram.attributes.position);

			gl.clear(gl.DEPTH_BUFFER_BIT);
		}

		function turnPoint(point, move, dist, layer, width) {
			let [x, y, z] = point;

			let d;
			switch (move) {
				case 'L': d = x; break;
				case 'R': d = size - 1 - x; break;
				case 'U': d = size - 1 - y; break;
				case 'D': d = y; break;
				case 'B': d = z; break;
				case 'F': d = size - 1 - z; break;
			}

			if (d >= layer || d < layer - width) return point;

			const s = (size - 1) / 2;
			x -= s;
			y -= s;
			z -= s;

			const a = dist * Math.PI / 2;

			switch (move) {
				case 'F': [x, y] = rotatePoint(x, y, a); break;
				case 'B': [x, y] = rotatePoint(x, y, -a); break;
				case 'R': [y, z] = rotatePoint(y, z, a); break;
				case 'L': [y, z] = rotatePoint(y, z, -a); break;
				case 'U': [z, x] = rotatePoint(z, x, a); break;
				case 'D': [z, x] = rotatePoint(z, x, -a); break;
			}

			x = Math.round(x + s);
			y = Math.round(y + s);
			z = Math.round(z + s);

			return [x, y, z];
		}

		let highlights = [];

		function getHighlightId([x, y, z]) {
			return z * size * size + (size - 1 - y) * size + x;
		}

		function copy(target, i, src, j, stride) {
			target.set(src.slice(j * stride, (j + 1) * stride), i * stride);
		}

		function renderBoxes() {
			gl.useProgram(program);

			gl.activeTexture(gl.TEXTURE0);
			gl.bindTexture(gl.TEXTURE_2D, envMap);
			gl.uniform1i(program.uniforms.envMap, 0);
			gl.uniform1f(program.uniforms.envMapIntensity, settings.highlightsOnly ? 0 : (F() ? 1.0 : 0.02666));

			gl.uniformMatrix4fv(program.uniforms.projectionMatrix, false, projectionMatrix);
			gl.uniformMatrix4fv(program.uniforms.viewMatrix, false, viewMatrix);

			const x = -viewMatrix[12];
			const y = -viewMatrix[13];
			const z = -viewMatrix[14];

			const camPos = [
				viewMatrix[0] * x + viewMatrix[1] * y + viewMatrix[2] * z,
				viewMatrix[4] * x + viewMatrix[5] * y + viewMatrix[6] * z,
				viewMatrix[8] * x + viewMatrix[9] * y + viewMatrix[10] * z
			];

			gl.uniform3fv(program.uniforms.lightPos, camPos);
			gl.uniform3fv(program.uniforms.camPos, camPos);

			let sortedColorData = colorData;
			let sortedMatrixData = matrixData;
			let indexMap = {};

			let objectCount = size ** 3;

			const cubesToRender = [];

			if (!highQuality) {
				objectCount = 8 + 6 * (size - 2) ** 2 + (size - 2) * 12 + Math.min(size - 2, 4) * (size - 2) ** 2;

				const processed = {};

				const animation = settings.playing && getAnimation();
				if (animation) {
					const list = [0, -1, animation.width - 1, animation.width];

					for (const i of list) {
						const d = animation.layer - 1 - i;
						if (d <= 0 || d >= size - 1) continue;

						for (let j = 0; j < size; j++) {
							for (let k = 0; k < size; k++) {
								const p = animation.turnCoord(i, j, k, animation.layer);
								const index = p[2] * size * size + p[1] * size + p[0];
								if (index in processed) continue;
								processed[index] = true;
								cubesToRender.push({ index, distance: 0 });
							}
						}
					}
				}

				for (let face = 0; face < Faces.length; face++) {
					for (let y = 0; y < size; y++) {
						for (let x = 0; x < size; x++) {
							const index = getCubeIndex(face, x, y);
							if (index in processed) continue;
							processed[index] = true;
							cubesToRender.push({ index, distance: 0 });
						}
					}
				}
			}

			if (settings.highlightsOnly) {
				if (cubesToRender.length === 0) {
					for (let i = 0; i < objectCount; i++) {
						cubesToRender.push({ index: i, distance: 0 });
					}
				}

				for (const cube of cubesToRender) {
					const j = cube.index * 16;
					const pos = matrixData.slice(j + 12, j + 15);
					cube.distance = Math.hypot(pos[0] - camPos[0], pos[1] - camPos[1], pos[2] - camPos[2]);
				}

				cubesToRender.sort((a, b) => b.distance - a.distance);
			}

			if (cubesToRender.length > 0) {
				sortedMatrixData = new Float32Array(cubesToRender.length * 16);
				sortedColorData = new Float32Array(cubesToRender.length * 6);

				for (let i = 0; i < cubesToRender.length; i++) {
					const j = cubesToRender[i].index;
					indexMap[j] = i;
					copy(sortedColorData, i, colorData, j, 6);
					copy(sortedMatrixData, i, matrixData, j, 16);
				}
			}

			const renderCount = cubesToRender.length || objectCount;

			const ids = new Int32Array(MAX_HIGHLIGHTS).fill(-1);
			if (settings.showHighlights) {
				for (let i = 0; i < highlights.length; i++) {
					const id = getHighlightId(highlights[i]);
					ids[i] = id in indexMap ? indexMap[id] : id;
				}

				if (hoveredCubeId > -1) {
					ids[ids.length - 1] = hoveredCubeId in indexMap ? indexMap[hoveredCubeId] : hoveredCubeId;
				}
			}
			gl.uniform1iv(program.uniforms[`highlightId[0]`], ids);
			gl.uniform1i(program.uniforms.highlightsOnly, settings.highlightsOnly);
			gl.uniform1f(program.uniforms.now, now);

			const mesh = highQuality ? cubicleMesh : cubeMesh;

			gl.bindBuffer(gl.ARRAY_BUFFER, mesh.positionBuffer);
			gl.enableVertexAttribArray(program.attributes.position);
			gl.vertexAttribPointer(program.attributes.position, 3, gl.FLOAT, false, 0, 0);
			gl.vertexAttribDivisor(program.attributes.position, 0);

			gl.bindBuffer(gl.ARRAY_BUFFER, mesh.normalBuffer);
			gl.enableVertexAttribArray(program.attributes.normal);
			gl.vertexAttribPointer(program.attributes.normal, 3, gl.FLOAT, false, 0, 0);
			gl.vertexAttribDivisor(program.attributes.normal, 0);

			gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
			gl.bufferSubData(gl.ARRAY_BUFFER, 0, sortedColorData);
			gl.enableVertexAttribArray(program.attributes.faceColors1);
			gl.vertexAttribPointer(program.attributes.faceColors1, 4, gl.FLOAT, false, 4 * 6, 0);
			gl.vertexAttribDivisor(program.attributes.faceColors1, 1);

			gl.enableVertexAttribArray(program.attributes.faceColors2);
			gl.vertexAttribPointer(program.attributes.faceColors2, 2, gl.FLOAT, false, 4 * 6, 4 * 4);
			gl.vertexAttribDivisor(program.attributes.faceColors2, 1);

			gl.bindBuffer(gl.ARRAY_BUFFER, matrixBuffer);
			gl.bufferSubData(gl.ARRAY_BUFFER, 0, sortedMatrixData);
			for (let i = 0; i < 4; i++) {
				const location = program.attributes.modelMatrix + i;
				gl.enableVertexAttribArray(location);
				gl.vertexAttribPointer(location, 4, gl.FLOAT, false, 4 * 16, i * 4 * 4);
				gl.vertexAttribDivisor(location, 1);
			}

			if (settings.highlightsOnly) {
				gl.cullFace(gl.FRONT);
				gl.depthMask(false);
				gl.drawArraysInstanced(gl.TRIANGLES, 0, mesh.vertexCount, renderCount);
			}

			gl.cullFace(gl.BACK);
			gl.depthMask(true);
			gl.drawArraysInstanced(gl.TRIANGLES, 0, mesh.vertexCount, renderCount);

			gl.disableVertexAttribArray(program.attributes.position);
			gl.disableVertexAttribArray(program.attributes.normal);
			for (let i = 0; i < 4; i++) {
				const location = program.attributes.modelMatrix + i;
				gl.disableVertexAttribArray(location);
				gl.vertexAttribDivisor(location, 0);
			}

			gl.disableVertexAttribArray(program.attributes.faceColors1);
			gl.vertexAttribDivisor(program.attributes.faceColors1, 0);

			gl.disableVertexAttribArray(program.attributes.faceColors2);
			gl.vertexAttribDivisor(program.attributes.faceColors2, 0);
		}

		function animate() {
			update();
			render();
			window.requestAnimationFrame(animate);
		}

		function createProgram(vert, frag) {
			const vShader = createShader(vert, true);
			const fShader = createShader(frag, false);

			const program = gl.createProgram();
			gl.attachShader(program, vShader);
			gl.attachShader(program, fShader);
			gl.linkProgram(program);

			gl.deleteShader(vShader);
			gl.deleteShader(fShader);

			if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
				throw new Error(`failed to link program: ${gl.getProgramInfoLog(program)}`);
			}

			const attributeCount = gl.getProgramParameter(program, gl.ACTIVE_ATTRIBUTES);
			program.attributes = {};
			for (let i = 0; i < attributeCount; i++) {
				const info = gl.getActiveAttrib(program, i);
				program.attributes[info.name] = gl.getAttribLocation(program, info.name);
			}

			const uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
			program.uniforms = {};
			for (let i = 0; i < uniformCount; i++) {
				const info = gl.getActiveUniform(program, i);
				program.uniforms[info.name] = gl.getUniformLocation(program, info.name);
			}

			return program;
		}

		function createShader(src, isVertex) {
			const shader = gl.createShader(isVertex ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER);
			gl.shaderSource(shader, src);
			gl.compileShader(shader);

			if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
				throw new Error(`failed to compile ${isVertex ? 'vertex' : 'fragment'} shader! ${gl.getShaderInfoLog(shader)}`);
			}

			return shader;
		}

		function createBuffer(data, dynamic) {
			const buffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
			gl.bufferData(gl.ARRAY_BUFFER, data, dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
			return buffer;
		}

		function lerpAngle(a, b, t) {
			let da = (b - a) % PI2;
			da = 2 * da % PI2 - da;
			return a + da * t;
		}

		function lerp(start, target, t) {
			const d = target - start;
			if (Math.abs(d) < 1e-4) return target;
			return start + d * t;
		}

		function getLerpFactor(f) {
			return 1 - Math.exp(-f * dt / 16);
		}

		function hexToRgb(hex) {
			if (hex.length >= 7) {
				return [
					parseInt(hex.slice(1, 3), 16),
					parseInt(hex.slice(3, 5), 16),
					parseInt(hex.slice(5, 7), 16)
				];
			} else {
				return [
					parseInt(hex.slice(1, 2).repeat(2), 16),
					parseInt(hex.slice(2, 3).repeat(2), 16),
					parseInt(hex.slice(3, 4).repeat(2), 16)
				];
			}
		}

		function RoundedBoxMesh(r = 0, segments = 4) {
			const allPositions = [];
			const allNormals = [];

			const min = [-0.5 + r, -0.5 + r, -0.5 + r];
			const max = [0.5 - r, 0.5 - r, 0.5 - r];

			// mid
			grid(r, r, 1 - r * 2, 1 - r * 2, 1, 1);

			if (r > 0) {
				// corners
				grid(0, 0, r, r, segments, segments);
				grid(1 - r, 0, r, r, segments, segments);
				grid(1 - r, 1 - r, r, r, segments, segments);
				grid(0, 1 - r, r, r, segments, segments);

				// edges
				grid(0, r, r, 1 - r * 2, segments, 1);
				grid(1 - r, r, r, 1 - r * 2, segments, 1);
				grid(r, 0, 1 - r * 2, r, 1, segments);
				grid(r, 1 - r, 1 - r * 2, r, 1, segments);
			}

			const faceVertexCount = allPositions.length;

			for (let j = 1; j < 6; j++) {
				for (let i = 0; i < faceVertexCount; i += 3) {
					const p = [
						allPositions[i],
						allPositions[i + 1],
						allPositions[i + 2]
					];
					const n = [
						allNormals[i],
						allNormals[i + 1],
						allNormals[i + 2]
					];
					let a, q, r;
					if (j >= 4) {
						q = 1;
						r = 2;
						a = (j === 4 ? 1 : -1) * Math.PI / 2;
					} else {
						a = j * Math.PI / 2;
						q = 0;
						r = 2;
					}
					[p[q], p[r]] = rotatePoint(p[q], p[r], a);
					[n[q], n[r]] = rotatePoint(n[q], n[r], a);
					allPositions.push(...p);
					allNormals.push(...n);
				}
			}

			return {
				positionBuffer: createBuffer(new Float32Array(allPositions)),
				normalBuffer: createBuffer(new Float32Array(allNormals)),
				vertexCount: allPositions.length / 3
			};

			function grid(startX, startY, width, height, segmentsX, segmentsY) {
				const positions = [];
				const normals = [];

				for (let y = 0; y <= segmentsY; y++) {
					for (let x = 0; x <= segmentsX; x++) {
						const p = [
							-0.5 + startX + x / segmentsX * width,
							-0.5 + startY + y / segmentsY * height,
							0.5
						];

						const clamped = [
							Math.clamp(p[0], min[0], max[0]),
							Math.clamp(p[1], min[1], max[1]),
							Math.clamp(p[2], min[2], max[2])
						];

						let normal = [0, 0, 1];

						if (r > 0) {
							normal = normalize([
								p[0] - clamped[0],
								p[1] - clamped[1],
								p[2] - clamped[2]
							]);

							clamped[0] += normal[0] * r;
							clamped[1] += normal[1] * r;
							clamped[2] += normal[2] * r;
						}

						positions.push(clamped);
						normals.push(normal);
					}
				}

				const w = segmentsX + 1;

				for (let y = 0; y < segmentsY; y++) {
					for (let x = 0; x < segmentsX; x++) {
						const a = positions[y * w + x];
						const b = positions[y * w + x + 1];
						const c = positions[(y + 1) * w + x + 1];
						const d = positions[(y + 1) * w + x];

						const na = normals[y * w + x];
						const nb = normals[y * w + x + 1];
						const nc = normals[(y + 1) * w + x + 1];
						const nd = normals[(y + 1) * w + x];

						allPositions.push(
							...a, ...b, ...c,
							...a, ...c, ...d
						);

						allNormals.push(
							...na, ...nb, ...nc,
							...na, ...nc, ...nd
						);
					}
				}
			}

			return new Float32Array(out);
		}

		function Grid(size = 20) {
			const canvas = document.createElement('canvas');
			canvas.width = canvas.height = size;
			const ctx = canvas.getContext('2d');

			ctx.fillStyle = '#151515';
			ctx.fillRect(0, 0, size, size);

			ctx.beginPath();
			const s = size / 2;
			ctx.moveTo(s, 0);
			ctx.lineTo(s, size);
			ctx.moveTo(0, s);
			ctx.lineTo(size, s);
			ctx.lineWidth = size * 0.04;
			ctx.strokeStyle = 'hsla(0, 0%, 100%, 0.02)';
			ctx.stroke();

			return canvas;
		}

		function normalize(p) {
			const length = Math.hypot(...p);
			if (length > 0) {
				const f = 1 / length;
				p[0] *= f;
				p[1] *= f;
				p[2] *= f;
			}
			return p;
		}

		function solve() {
			if (cube.isSolved()) return;
			if (cube.size === 3) return solve3(cube);
			solveN(cube);
		}

		const settings = {
			animTime: [0.69, 0.001, 2, 0.001],
			orbitSpeed: [1, 0, 50, 1],
			cubeSize: [size, 1, 50, 1], 
			playing: true,
			showHighlights: true,
			showDirections: true,
			highlightsOnly: false, 
			moveLayer: [1, 1, size, 1], 
			moveWidth: [1, 1, size, 1]
		};

		const settingOnChange = {
			cubeSize(v) {
				size = v;
				nDepth = 2 * size;
				initBuffers();
				reset();

				['moveLayer', 'moveWidth'].forEach(name => {
					settings[name] = 1;

					const el = document.getElementById(name);
					el.value = el.nextElementSibling.innerText = settings[name];
					el.max = size;
					el.onchange();
				});
			}
		};

		function SettingsUI() {
			const settingsEl = document.querySelector('.settings');

			for (const key in settings) {
				const value = settings[key];

				if (Array.isArray(value)) {
					const [n, min, max, step] = value;
					settings[key] = n;

					const el = fromHtml(`<div class="row">
						<div>${fromCamel(key)}:</div>
						<input type="range" class="range" min="${min}" max="${max}" step="${step}" id="${key}">
						<div></div>
					</div>`);

					const rangeEl = el.querySelector('.range');
					rangeEl.value = n;
					rangeEl.nextElementSibling.innerText = n;
					rangeEl.onchange = function() {
						settings[key] = parseFloat(this.value);
						this.nextElementSibling.innerText = settings[key];
						settingOnChange[key] && settingOnChange[key](settings[key]);
					}
					rangeEl.oninput = function() {
						this.nextElementSibling.innerText = this.value;
					}

					settingsEl.appendChild(el);
				} else {
					const el = fromHtml(`<label class="row">
						<input type="checkbox" class="checkbox" id="${key}">
						<div>${fromCamel(key)}</div>
					</label>`);

					const checkboxEl = el.querySelector('.checkbox');
					checkboxEl.checked = value;

					checkboxEl.onchange = function() {
						settings[key] = this.checked;
						settingOnChange[key] && settingOnChange[key](settings[key]);
					}

					settingsEl.appendChild(el);
				}
			}

			const btnsEl = fromHtml(`<div class="row" style="margin: 3px 0;">
				<div class="btn solve-btn">solve</div>
				<div class="btn scramble-btn">scramble</div>
				<div class="btn reset-btn">reset</div>
			</div>`);
			settingsEl.appendChild(btnsEl);

			btnsEl.querySelector('.solve-btn').onclick = solve;
			btnsEl.querySelector('.scramble-btn').onclick = () => cube.scramble();
			btnsEl.querySelector('.reset-btn').onclick = () => reset();

			const moves = `F B R L U D F' B' R' L' U' D' x y z x' y' z'`.split(' ');

			const movesEl = fromHtml(`<div style="width: 170px;"></div>`);
			settingsEl.appendChild(movesEl);

			for (const move of moves) {
				const el = fromHtml(`<div class="btn" style="
					margin: 5px; 
					margin-top: 0; 
					margin-left: 0; 
					display: inline-block;
				">${move}</div>`);
				el.move = move;
				el.onclick = moveOnClick;
				movesEl.appendChild(el);
			}

			function moveOnClick() {
				let text = this.move;
				let move = text[0];
				let dist = 1;
				let layer = settings.moveLayer;
				let width = Math.min(settings.moveWidth, layer);

				if (move in AxisMoves) {
					move = AxisMoves[move];
					layer = width = cube.size;
				}

				if (text[1] === `'`) dist *= -1;

				cube.turn(move, dist, layer, width);
			}
		}

		function fromCamel(text) {
			text = text.replace(/([A-Z])/g, ' $1');
			return text.charAt(0).toUpperCase() + text.slice(1);
		}

		function fromHtml(html) {
			const div = document.createElement('div');
			div.innerHTML = html;
			return div.children[0];
		}

		SettingsUI();

		initBuffers();
		reset(true);
		animate();

		async function test(size = 3, n = 1000, step = 250) {
			const startTime = Date.now();

			let max = -Infinity;
			let min = Infinity;
			let avg = 0;

			for (let i = 1; i <= n; i++) {
				const cube = new Cube(size);
				cube.scramble();

				let moves = 0;
				cube.onTurn = () => moves++;
				size === 3 ? solve3(cube) : solveN(cube);
				if (!cube.isSolved()) throw new Error('not solved');
				avg += moves;

				min = Math.min(min, moves);
				max = Math.max(max, moves);

				if (i % step === 0) {
					console.log(`testing: ${i}/${n} (${(i / n * 100).toFixed(2)}%)...`);
					await sleep(0);
				}
			}

			avg = Math.round(avg / n);

			const timeTaken = Date.now() - startTime;
			console.log(`tested ${n} ${size}x${size} cubes!! min moves: ${min}, max moves: ${max}, avg moves: ${avg}, time taken: ${timeTaken / 1000}s`);
		}

		function sleep(ms) {
			return new Promise(resolve => setTimeout(resolve, ms))
		}

		if (window.location.hostname.match(/(192\.168|localhost)/)) {
			canvas.onclick = () => document.documentElement.requestFullscreen();
		}

		// test(10, 500, 50);

	</script>
