<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragdoll Soccer</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/style.css">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .webgl-content {
            width: 100vw;
            height: 100vh;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/UnityProgress.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/gertdoro/Kubeflow@c8e1bf03d9c16cfc040f744be5b7d77350e8dfd6/profile-controller/api/v1/ragdoll-soccer.js"></script>

    <script>
        var gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "https://cdn.jsdelivr.net/gh/gertdoro/Kubeflow@ee7e5c05db45dbe796e289c6c1cbbde8e328ad44/profile-controller/api/v1/ragdoll-soccer.json",
            {
                onProgress: UnityProgress,
                Module: {
                    onRuntimeInitialized: function () {
                        UnityProgress(gameInstance, "complete");
                    }
                }
            }
        );
    </script>

</body>
</html>
