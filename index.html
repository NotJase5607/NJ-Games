<!DOCTYPE html>
<html>
<head>
    <title>My Game Files</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .file {
            background: #222;
            margin: 10px auto;
            padding: 15px;
            width: 80%;
            border-radius: 10px;
        }

        a {
            color: #4da6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>🎮 My Games</h1>

<div id="files">Loading...</div>

<script>
const username = "YOUR_USERNAME";
const repo = "YOUR_REPO";

fetch(`https://api.github.com/repos/${username}/${repo}/contents`)
.then(response => response.json())
.then(data => {
    const filesDiv = document.getElementById("files");
    filesDiv.innerHTML = "";

    data.forEach(file => {
        if(file.type === "file") {
            filesDiv.innerHTML += `
                <div class="file">
                    <a href="${file.download_url}" target="_blank">
                        ${file.name}
                    </a>
                </div>
            `;
        }
    });
})
.catch(error => {
    document.getElementById("files").innerHTML =
        "Failed to load repository files.";
    console.error(error);
});
</script>

</body>
</html>
