<!DOCTYPE html>
<html>
<head>
    <title>My Games</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }

        h1 {
            margin-top: 30px;
        }

        #games {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }

        .game {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            width: 220px;
        }

        .game button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h1>🎮 My Games</h1>

<div id="games">Loading...</div>

<script>
const USERNAME = "YOUR_USERNAME";
const REPO = "YOUR_REPO";

fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents`)
.then(res => res.json())
.then(files => {
    const games = document.getElementById("games");
    games.innerHTML = "";

    files.forEach(file => {
        if (
            file.name.endsWith(".html") &&
            file.name.toLowerCase() !== "index.html"
        ) {
            const div = document.createElement("div");
            div.className = "game";

            div.innerHTML = `
                <h3>${file.name.replace(".html", "")}</h3>
                <button onclick="window.location.href='${file.name}'">
                    Play
                </button>
            `;

            games.appendChild(div);
        }
    });
});
</script>

</body>
</html>
