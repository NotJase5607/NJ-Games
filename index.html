<!DOCTYPE html>
<html>
<head>
<title>My Games</title>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

#games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.game{
    background:#222;
    width:250px;
    padding:20px;
    border-radius:12px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>🎮 My Games</h1>

<div id="games"></div>

<script>
const USERNAME = "NotJase5607";
const REPO = "NJ-Games";

fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents`)
.then(r => r.json())
.then(files => {
    const games = document.getElementById("games");

    files.forEach(file => {
        if (
            file.name.endsWith(".html") &&
            file.name.toLowerCase() !== "index.html"
        ) {
            const card = document.createElement("div");
            card.className = "game";

            const gameName = file.name
                .replace(".html","")
                .replace(/[-_]/g," ");

            card.innerHTML = `
                <h2>${gameName}</h2>
                <button onclick="location.href='${file.name}'">
                    Play
                </button>
            `;

            games.appendChild(card);
        }
    });
});
</script>

</body>
</html>
