<!DOCTYPE html>
<html>
<head>
<title>My Games</title>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

#auth-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

#auth-box {
    background: #222;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    max-width: 400px;
    width: 90%;
}

.google-btn {
    background: white;
    color: #333;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.google-btn:hover {
    background: #f1f1f1;
}

#main-content {
    display: none;
}

#error-msg {
    color: #ff6b6b;
    margin-top: 15px;
    font-size: 14px;
}

#games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.game{
    background:#222;
    width:250px;
    padding:20px;
    border-radius:12px;
}

button.play-btn {
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
    border-radius: 6px;
    border: none;
    background: #4e5d6c;
    color: white;
}

button.play-btn:hover {
    background: #5c6f84;
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="auth-screen">
    <div id="auth-box">
        <h2>🔒 Restricted Access</h2>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Sign in with your approved DDSB student Google account to view the games.</p>
        
        <button class="google-btn" onclick="signInWithGoogle()">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
            Sign in with Google
        </button>
        <div id="error-msg"></div>
    </div>
</div>

<!-- Main Game Hub (Hidden initially) -->
<div id="main-content">
    <h1>🎮 My Games</h1>
    <div id="games"></div>
</div>

<!-- Firebase SDK Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBaeCAjV0RXfCuXBfqoA_j0MEB4dWkHVhM",
        authDomain: "nj-games-de09a.firebaseapp.com",
        projectId: "nj-games-de09a",
        storageBucket: "nj-games-de09a.firebasestorage.app",
        messagingSenderId: "943454234278",
        appId: "1:943454234278:web:fc03f8b197c8816360b667",
        measurementId: "G-3DK0R6342Z"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // APPROVED EMAILS LIST
    const allowedEmails = [
        "s300067953@ddsbstudent.ca",
        "s300068467@ddsbstudent.ca",
        "s300068479@ddsbstudent.ca",
        "s300068482@ddsbstudent.ca",
        "s300073726@ddsbstudent.ca"
    ];

    // Expose functions globally so the HTML buttons can call them
    window.signInWhenClicked = function() {
        const errorDiv = document.getElementById("error-msg");
        errorDiv.textContent = "";

        signInWithPopup(auth, provider)
        .then((result) => {
            const user = result.user;
            const userEmail = user.email.toLowerCase();

            if (allowedEmails.includes(userEmail)) {
                grantAccess();
            } else {
                errorDiv.textContent = "Access denied. Your Google account is not on the approved list.";
                auth.signOut(); // Sign them out automatically if not allowed
            }
        }).catch((error) => {
            console.error(error);
            errorDiv.textContent = "Sign-in failed or was cancelled.";
        });
    };

    // Keep user logged in if they refresh the page and were already verified
    onAuthStateChanged(auth, (user) => {
        if (user && allowedEmails.includes(user.email.toLowerCase())) {
            grantAccess();
        }
    });

    function grantAccess() {
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("main-content").style.display = "block";
        loadGames();
    }

    function loadGames() {
        const USERNAME = "NotJase5607";
        const REPO = "NJ-Games";

        fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents`)
        .then(r => r.json())
        .then(files => {
            const games = document.getElementById("games");
            games.innerHTML = ""; // Clear existing elements if reloading

            files.forEach(file => {
                if (
                    file.name.endsWith(".html") &&
                    file.name.toLowerCase() !== "index.html"
                ) {
                    const card = document.createElement("div");
                    card.className = "game";

                    const gameName = file.name
                        .replace(".html","")
                        .replace(/[-_]/g," ");

                    card.innerHTML = `
                        <h2>${gameName}</h2>
                        <button class="play-btn" onclick="location.href='${file.name}'">
                            Play
                        </button>
                    `;

                    games.appendChild(card);
                }
            });
        });
    }
</script>

<script>
    // Bridge regular button click to the module scope function
    function signInWithGoogle() {
        if (window.signInWhenClicked) {
            window.signInWhenClicked();
        }
    }
</script>

</body>
</html>
