<!DOCTYPE html>
<html lang="en">
<head>
<title>NJ Games Login</title>

<style>
body{margin:0;padding:0;}

/* Login page */
#login-page{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:120px;
  min-height:100vh;
  box-sizing:border-box;
  position:relative;
}

#login-page input,#login-page button{
  padding:12px;
  font-size:18px;
}

/* Blocked screen — unchanged */
:root{
  --card-bg:#ffffff;
  --page-bg:#f6f7f8;
  --accent:#d93b32;
  --muted:#6b7280;
  --shadow:0 6px 22px rgba(16,24,40,0.06);
}

#blocked-overlay{
  position:fixed;
  inset:0;
  background:var(--page-bg);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  font-family:"Helvetica Neue",Arial,sans-serif;
  color:#111827;
  box-sizing:border-box;
  transition:opacity 0.4s ease;
}

#blocked-overlay.fade-out{
  opacity:0;
  pointer-events:none;
}

.card{
  width:min(920px,94%);
  background:var(--card-bg);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:34px 40px;
  box-sizing:border-box;
  border:1px solid rgba(16,24,40,0.04);
  display:grid;
  grid-template-columns:1fr 320px;
  gap:24px;
}

.left{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.brand-row{
  display:flex;
  gap:18px;
  align-items:flex-start;
}

.emblem{
  width:48px;
  height:36px;
  border-radius:6px;
  background:linear-gradient(90deg,#d93b32,#e7544c);
  display:grid;
  place-items:center;
  cursor:pointer;
}

.emblem svg{
  width:26px;
  height:22px;
  fill:#fff;
}

.subtitle{font-weight:700;font-size:16px;}
.lead{color:var(--muted);font-size:14px;}

.info-row{display:flex;gap:12px;margin-top:10px;}
.info-label{width:96px;font-weight:600;}
.info-value{font-family:"Courier New",monospace;}

/* secret box */
#secret-box{
  position:absolute;
  top:10px;
  left:10px;
  width:40px;
  height:40px;
  background:#111;
  z-index:1000;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-page">
  <div id="secret-box" onclick="showAdmin()"></div>

  <h1>🎮 NJ Games</h1>
  <h2>Enter Access Code</h2>

  <input type="password" id="code">
  <br>
  <button onclick="fakeLogin()">Enter</button>
</div>

<!-- BLOCKED SCREEN (UNCHANGED) -->
<div id="blocked-overlay">
  <div class="card">
    <div class="left">
      <div class="brand-row">
        <div class="emblem" onclick="unlockPortal()">
          <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5L12 1z"/>
          </svg>
        </div>

        <div>
          <h1>Network Protection — Access Blocked</h1>
          <p>Web Page Blocked</p>
        </div>
      </div>

      <div class="subtitle">Access has been denied</div>

      <div class="lead">
        The page you have requested has been blocked.
      </div>

      <div class="info-row">
        <div class="info-label">URL</div>
        <div class="info-value">https://nj-games.netlify.app/</div>
      </div>

      <div class="info-row">
        <div class="info-label">Description</div>
        <div class="info-value">Blocked by policy.</div>
      </div>

    </div>
  </div>
</div>

<!-- ADMIN PAGE -->
<div id="admin-page" style="display:none;background:#111;color:white;text-align:center;padding-top:120px;height:100vh;">
  <h1>🔒 Admin Login</h1>
  <input type="password" id="adminCode">
  <br><br>
  <button onclick="adminLogin()">Login</button>
  <button onclick="back()">Back</button>
</div>

<script>

/* split key (option 2 style) */
function getKey(){
  return ["secret", ".", "code", "=", "hidden"].join("");
}

/* fake login */
function fakeLogin(){
  alert("YOU GOT TROLLED");
}

/* navigation */
function showAdmin(){
  document.getElementById("login-page").style.display="none";
  document.getElementById("admin-page").style.display="block";
}

function back(){
  document.getElementById("admin-page").style.display="none";
  document.getElementById("login-page").style.display="block";
}

/* login check */
function adminLogin(){
  const code = document.getElementById("adminCode").value;

  if(code === getKey()){
    window.location.href =
      "https://sites.google.com/ddsbstudent.ca/nj-games1/home";
  } else {
    alert("Wrong password!");
  }
}

function unlockPortal(){
  document.getElementById("blocked-overlay").classList.add("fade-out");
  setTimeout(()=>document.getElementById("blocked-overlay").style.display="none",420);
}

</script>

</body>
</html>
