<!DOCTYPE html>
<html>
<head>
<title>My Games</title>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

#games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.game{
    background:#222;
    width:250px;
    padding:20px;
    border-radius:12px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>🎮 My Games</h1>

<div id="games"></div>

<script>
const USERNAME = "NotJase5607";
const REPO = "NJ-Games";

function launchGame(fileName, displayName) {
    // Dynamically calculate the URL based on how the user opened the hub
    const base = window.location.href.split('index.html')[0].replace(/\/$/, "");
    const gameUrl = `${base}/${fileName}`;
    
    // Open blank tab
    const newWindow = window.open("about:blank", "_blank");

    if (newWindow) {
        // Build the structure cleanly using standard HTML stream rules
        newWindow.document.write(`
            <!DOCTYPE html>
            <html style="margin:0; padding:0; height:100%; width:100%; overflow:hidden;">
            <head>
                <meta charset="UTF-8">
                <title>${displayName}</title>
            </head>
            <body style="margin:0; padding:0; height:100%; width:100%; overflow:hidden; background-color:#000;">
                <iframe src="${gameUrl}" style="border:none; width:100%; height:100%; margin:0; padding:0; display:block;"></iframe>
            </body>
            </html>
        `);
        newWindow.document.close();
    } else {
        alert("Popup blocked! Please allow popups to play this game.");
    }
}

fetch(`https://github.com{USERNAME}/${REPO}/contents`)
.then(r => {
    if (!r.ok) throw new Error("API Limit reached or private repo");
    return r.json();
})
.then(files => {
    const games = document.getElementById("games");

    files.forEach(file => {
        if (
            file.name.endsWith(".html") &&
            file.name.toLowerCase() !== "index.html"
        ) {
            const card = document.createElement("div");
            card.className = "game";

            const gameName = file.name
                .replace(".html","")
                .replace(/[-_]/g," ");

            card.innerHTML = `
                <h2>${gameName}</h2>
                <button onclick="launchGame('${file.name}', '${gameName}')">
                    Play
                </button>
            `;

            games.appendChild(card);
        }
    });
})
.catch(err => {
    document.getElementById("games").innerHTML = `<p style="color:#ff4444;">Error loading game directory. Check console or try again later.</p>`;
    console.error(err);
});
</script>

</body>
</html>
