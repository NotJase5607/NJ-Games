<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="pragma" content="no-cache">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Created with GameMaker: Studio</title>

    <style>
        body {
            background: #000;
            color: #cccccc;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
        }

        canvas {
            width: 100vw;
            display: block;
        }

        div.gm4html5_div_class {
            margin: 0;
            padding: 0;
            border: 0;
        }

        :-webkit-full-screen #canvas,
        :fullscreen #canvas {
            width: 100%;
            height: 100%;
        }

        div.gm4html5_login {
            padding: 20px;
            position: absolute;
            border: solid 2px #000000;
            background-color: #404040;
            color: #00ff00;
            border-radius: 15px;
            box-shadow: #101010 20px 20px 40px;
        }

        div.gm4html5_cancel_button {
            float: right;
        }

        div.gm4html5_login_button {
            float: left;
        }

        div.gm4html5_login_header {
            text-align: center;
        }

        .controls-message {
            text-align: center;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="1024" height="375">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <div class="controls-message">
        <b>If the keys do not work, click anywhere on the game and continue playing.</b>
    </div>

    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/gh/bessiegasbarro/Rocked@8d9f4127e770f8d22db3153c305916ccf3ceb9f8/Rl2D.js">
    </script>

    <script>
        window.onload = GameMaker_Init;
    </script>

</body>
</html>
